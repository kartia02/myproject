services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pet_detective
      POSTGRES_USER: pet_detective
      POSTGRES_PASSWORD: pet_detective
    volumes:
      - pet_detective_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet_detective"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pet_detective:pet_detective@db:5432/pet_detective
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-low}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-4}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-900}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pet_detective_db:
